<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Corte del huipil masculino</title>
  <desc id="desc">Dos lienzos rectos, escote cuadrado, mangas cortas y aberturas laterales. Medidas para talla L.</desc>
  <rect width="720" height="520" fill="#14110d"/>
  <text x="360" y="36" fill="#c9a227" font-family="Georgia, serif" font-size="18" text-anchor="middle">Corte  talla L</text>

  <!-- Back panel -->
  <g transform="translate(80,70)">
    <rect x="40" y="20" width="200" height="360" fill="#1c1914" stroke="#c9a227" stroke-width="1.5"/>
    <rect x="110" y="20" width="60" height="36" fill="#14110d" stroke="#e07a2f"/>
    <text x="140" y="16" fill="#f3e6c8" font-size="11" text-anchor="middle" font-family="sans-serif">ESPALDA 62 × 90</text>
    <line x1="40" y1="308" x2="40" y2="380" stroke="#c43b6e" stroke-width="3"/>
    <line x1="240" y1="308" x2="240" y2="380" stroke="#c43b6e" stroke-width="3"/>
    <text x="140" y="400" fill="#8a8174" font-size="10" text-anchor="middle" font-family="sans-serif">aberturas 18 cm</text>
  </g>

  <!-- Front panel -->
  <g transform="translate(360,70)">
    <rect x="40" y="20" width="200" height="360" fill="#1c1914" stroke="#c9a227" stroke-width="1.5"/>
    <rect x="110" y="20" width="60" height="36" fill="#14110d" stroke="#e07a2f"/>
    <circle cx="140" cy="110" r="28" fill="none" stroke="#e07a2f" stroke-width="1.5"/>
    <text x="140" y="114" fill="#e07a2f" font-size="10" text-anchor="middle" font-family="sans-serif">Uzumaki</text>
    <text x="140" y="16" fill="#f3e6c8" font-size="11" text-anchor="middle" font-family="sans-serif">FRENTE 62 × 90</text>
    <text x="140" y="400" fill="#8a8174" font-size="10" text-anchor="middle" font-family="sans-serif">escote 18 × 16 cm</text>
  </g>

  <g fill="#f3e6c8" font-family="sans-serif" font-size="12">
    <text x="80" y="480">Lienzos rectos, sin pinzas. Hombros al doblez o costura recta. Manga 22 cm. Ruedo y puños se bordan al final.</text>
  </g>
</svg>
